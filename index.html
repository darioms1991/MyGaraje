  <style>

      border: none;

      font-size: 16px;

    function esc(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parseDecimal(val) {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (val === null || val === undefined || val === "") return 0;
      var s = String(val).replace(/[\s\u20ac]/g, "");
      if (s.indexOf(",") !== -1) {
        s = s.replace(/\./g, "").replace(",", ".");
      } else if (/^\d{1,3}(\.\d{3})+$/.test(s)) {
        s = s.replace(/\./g, "");
      }
      var num = parseFloat(s);
      return isNaN(num) ? 0 : num;
    }

    function formatMoney(num) {
      var n = parseDecimal(num);
      return n.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " \u20ac";
    }

    function formatDateES(dateStr) {
      if (!dateStr) return "Sin fecha";
      var parts = dateStr.split("-");
      if (parts.length !== 3) return dateStr;
      return parts[2] + "/" + parts[1] + "/" + parts[0];
    }

    function genId() {
      return Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 8);
    }

    function getDaysUntilAnnual(dateStr) {
      if (!dateStr) return null;
      var parts = dateStr.split("-");
      if (parts.length !== 3) return null;
      var month = parseInt(parts[1], 10) - 1;
      var day = parseInt(parts[2], 10);
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var target = new Date(now.getFullYear(), month, day);
      if (target < today) {
        target = new Date(now.getFullYear() + 1, month, day);
      }
      var diffMs = target.getTime() - today.getTime();
      return Math.round(diffMs / (1000 * 60 * 60 * 24));
    }

    function getDaysUntil(dateStr) {

      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var target = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      return Math.round((target.getTime() - today.getTime()) / 86400000);
    }

    function storagePathFromUrl(url) {
      if (!url) return null;
      var marker = "/" + BUCKET_NAME + "/";
      var i = url.indexOf(marker);
      if (i === -1) return null;
      try { return decodeURIComponent(url.slice(i + marker.length).split("?")[0]); } catch (e) { return null; }
    }

    var signedCache = {};

    async function signUrl(url) {

      if (!p) return url;
      try {
        var r = await sb.storage.from(BUCKET_NAME).createSignedUrl(p, 3600);
        if (r.data && r.data.signedUrl) return r.data.signedUrl;
      } catch (e) { console.warn("No se pudo firmar el archivo:", e); }
      return url;
    }

    async function signPhotos() {
      var map = {};
      var paths = [];
      state.vehicles.forEach(function(v) {
        var p = storagePathFromUrl(v.foto_url);
        if (p && !map[p]) { map[p] = v.foto_url; paths.push(p); }
      });
      signedCache = {};
      if (!paths.length) return;
      try {
        var r = await sb.storage.from(BUCKET_NAME).createSignedUrls(paths, 3600);
        (r.data || []).forEach(function(it) {
          if (it.signedUrl && map[it.path]) signedCache[map[it.path]] = it.signedUrl;
        });
      } catch (e) { console.warn("No se pudieron firmar las fotos:", e); }
    }

    function getVehicleAlerts(v) {
      var alerts = [];
      var checks = [
        { type: "Seguro", date: v.seguro_fecha, lead: parseInt(v.seguro_aviso, 10), amount: v.seguro_importe, annual: true },
        { type: "Impuesto", date: v.impuesto_fecha, lead: parseInt(v.impuesto_aviso, 10), amount: v.impuesto_importe, annual: true },
        { type: "ITV", date: v.itv_fecha, lead: parseInt(v.itv_aviso, 10), amount: 0, annual: false }
      ];
      for (var j = 0; j < checks.length; j++) {
        var c = checks[j];
        var leadVal = isNaN(c.lead) ? 15 : c.lead;
        if (c.date && leadVal >= 0) {
          var days = c.annual ? getDaysUntilAnnual(c.date) : getDaysUntil(c.date);
          if (days !== null && days <= leadVal) {
            alerts.push({
              vehicleId: v.id,
              vehicleName: v.nombre,
              type: c.type,
              days: days,
              date: c.date,
              amount: c.amount

      alerts.sort(function(a, b) { return a.days - b.days; });
      return alerts;

      var v = state.vehicles.find(function(x) { return x.id === vehicleId; });
      if (!v) return;
      var cfg = {

        impuesto: { concept: "Impuesto circulaci\u00f3n", date: v.impuesto_fecha, lead: v.impuesto_aviso, amount: v.impuesto_importe, annual: true },
        itv: { concept: "ITV", date: v.itv_fecha, lead: v.itv_aviso, amount: 0, annual: false }
      }[kind];
      if (!cfg || !cfg.date) return;
      var lead = parseInt(cfg.lead, 10);
      downloadICS(v.nombre, cfg.concept, cfg.date, (isNaN(lead) || lead < 0) ? 7 : lead, cfg.amount, cfg.annual);

    function icsEscape(text) {
      return String(text).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
    }

    function downloadICS(vehicleName, concept, dateStr, leadDays, amount, annual) {
      if (!dateStr) return;
      var parts = dateStr.split("-");
      var year = parseInt(parts[0], 10);
      var month = parseInt(parts[1], 10) - 1;
      var day = parseInt(parts[2], 10);
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var target = new Date(annual ? now.getFullYear() : year, month, day);
      if (annual && target < today) {
        target = new Date(now.getFullYear() + 1, month, day);
      }
      function ymd(d) {
        return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
      }
      var dtStart = ymd(target);
      var dtEnd = ymd(new Date(target.getFullYear(), target.getMonth(), target.getDate() + 1));
      var stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
      var alarmDays = (leadDays !== null && leadDays >= 0) ? leadDays : 7;
      var desc = (annual ? "Vencimiento anual de " : "Vencimiento de ") + concept + " para " + vehicleName;
      if (parseDecimal(amount) > 0) {
        desc += " (Importe estimado: " + formatMoney(amount) + ")";
      }
      var lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Mi Garaje//App iOS//ES",
        "BEGIN:VEVENT",
        "UID:" + genId() + "@migaraje.app",
        "DTSTAMP:" + stamp,
        "DTSTART;VALUE=DATE:" + dtStart,
        "DTEND;VALUE=DATE:" + dtEnd
      ];
      if (annual) lines.push("RRULE:FREQ=YEARLY");
      lines.push(
        "SUMMARY:" + icsEscape(concept + " - " + vehicleName),
        "DESCRIPTION:" + icsEscape(desc),
        "BEGIN:VALARM",
        "TRIGGER:-P" + alarmDays + "D",
        "ACTION:DISPLAY",
        "DESCRIPTION:" + icsEscape("Recordatorio: " + concept + " (" + vehicleName + ")"),
        "END:VALARM",
        "END:VEVENT",
        "END:VCALENDAR"
      );
      var blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "recordatorio_" + concept.toLowerCase().replace(/[^a-z0-9]+/g, "_") + ".ics";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }

    function compressImage(file, maxSize, quality) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var w = img.width;
            var h = img.height;
            if (w > maxSize || h > maxSize) {
              if (w > h) {
                h = Math.round(h * maxSize / w);
                w = maxSize;
              } else {
                w = Math.round(w * maxSize / h);
                h = maxSize;
              }
            }
            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            canvas.toBlob(function(blob) {
              resolve(blob || file);
            }, "image/jpeg", quality);
          };
          img.onerror = function() { resolve(file); };
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadFileToSupabase(file, folder) {
      var userId = state.session.user.id;
      var isImage = file.type && file.type.indexOf("image/") === 0;
      var uploadBlob = file;
      var ext = "bin";

      if (isImage) {
        var maxPx = folder === "vehiculos" ? 500 : 1400;
        uploadBlob = await compressImage(file, maxPx, 0.8);
        ext = "jpg";
      } else if (file.name && file.name.indexOf(".") !== -1) {
        ext = file.name.split(".").pop().toLowerCase();
      }

      var filePath = userId + "/" + folder + "/" + genId() + "." + ext;
      var res = await sb.storage.from(BUCKET_NAME).upload(filePath, uploadBlob, {
        contentType: isImage ? "image/jpeg" : (file.type || "application/octet-stream"),
        upsert: true
      });
      if (res.error) throw res.error;

      var pub = sb.storage.from(BUCKET_NAME).getPublicUrl(filePath);
      return pub.data.publicUrl;
    }

          '<div class="card empty-state">' +
            '<div class="empty-icon">' +
              '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>' +
            '</div>' +
            '<h2 class="empty-title">Falta conectar Supabase</h2>' +
            '<p class="empty-desc">Edita el archivo HTML y pega tu <b>Project URL</b> y tu <b>anon key</b> en las primeras l\u00edneas del c\u00f3digo antes de publicarlo.</p>' +
          '</div>' +
        '</div>';
    }

    function renderAuth() {
      var isLogin = state.authMode === "login";
      return '' +
        '<div class="container">' +
          '<div class="auth-box">' +
            '<div style="text-align:center; margin-bottom:20px;">' +
              '<div class="empty-icon" style="margin-bottom:12px;">' +
                '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>' +
              '</div>' +
              '<h1 style="font-size:26px; font-weight:700; margin:0 0 4px;">Mi Garaje</h1>' +
              '<p style="font-size:14px; color:var(--text-sec); margin:0;">Tus veh\u00edculos, gastos y facturas en la nube</p>' +
            '</div>' +
            '<div class="card">' +
              '<div class="auth-tabs">' +
                '<button type="button" class="auth-tab ' + (isLogin ? "active" : "") + '" onclick="switchAuthMode(\'login\')">Iniciar sesi\u00f3n</button>' +
                '<button type="button" class="auth-tab ' + (!isLogin ? "active" : "") + '" onclick="switchAuthMode(\'signup\')">Crear cuenta</button>' +
              '</div>' +
              (state.authError ? '<div class="msg-error">' + esc(state.authError) + '</div>' : '') +
              (state.authSuccess ? '<div class="msg-ok">' + esc(state.authSuccess) + '</div>' : '') +
              '<form onsubmit="handleAuthSubmit(event)">' +
                '<div class="form-group">' +
                  '<label class="form-label">Correo electr\u00f3nico</label>' +
                  '<input id="auth-email" type="email" class="form-input" placeholder="tu@email.com" value="' + esc(state.authEmail) + '" required autocomplete="email">' +
                '</div>' +
                '<div class="form-group">' +
                  '<label class="form-label">Contrase\u00f1a</label>' +
                  '<input id="auth-pass" type="password" class="form-input" placeholder="M\u00ednimo 6 caracteres" minlength="6" required autocomplete="' + (isLogin ? "current-password" : "new-password") + '">' +
                '</div>' +
                '<button type="submit" class="btn-primary" ' + (state.saving ? "disabled" : "") + '>' +
                  (state.saving ? "Conectando..." : (isLogin ? "Entrar a mi garaje" : "Registrarme")) +
                '</button>' +
              '</form>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function switchAuthMode(mode) {
      state.authMode = mode;
      state.authError = "";
      state.authSuccess = "";
      render();
    }

    function renderList() {
      var reminders = getAllActiveReminders();
      var hasUrgent = reminders.some(function(r) { return r.days <= 3; });

      var totalFixedAll = 0;
      var totalVarAll = 0;
      for (var t = 0; t < state.vehicles.length; t++) {
        var tv = state.vehicles[t];
        totalFixedAll += parseDecimal(tv.seguro_importe) + parseDecimal(tv.impuesto_importe);
      }
      for (var e = 0; e < state.expenses.length; e++) {
        totalVarAll += parseDecimal(state.expenses[e].importe);
      }
      var grandTotalAll = totalFixedAll + totalVarAll;

      var html = '' +
        '<div class="navbar"><div class="navbar-inner">' +
          '<button class="nav-btn danger" onclick="handleLogout()">Salir</button>' +
          '<div class="nav-title">Mi Garaje</div>' +
          '<button class="nav-btn right" onclick="openVehicleForm(null)">+ Veh\u00edculo</button>' +
        '</div></div>' +
        '<div class="container">' +
          '<h1 class="large-title">Mi Garaje</h1>';

      if (state.loading) {
        html += '<div class="loader-wrap">Sincronizando tu garaje...</div></div>';
        return html;
      }

      if (state.vehicles.length === 0) {
        html += '' +
          '<div class="card empty-state">' +
            '<div class="empty-icon">' +
              '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>' +
            '</div>' +
            '<h2 class="empty-title">Tu garaje est\u00e1 vac\u00edo</h2>' +
            '<p class="empty-desc">A\u00f1ade tu primer coche o moto para controlar el seguro, impuestos, ITV y todas las facturas del taller.</p>' +
            '<button class="btn-primary" onclick="openVehicleForm(null)">+ A\u00f1adir primer veh\u00edculo</button>' +
          '</div>';
      } else {
        html += '' +
          '<div class="hero-summary">' +
            '<div class="hero-label">Total: fijos de 1 a\u00f1o + gastos (' + state.vehicles.length + (state.vehicles.length === 1 ? ' veh\u00edculo' : ' veh\u00edculos') + ')</div>' +
            '<div class="hero-amount">' + formatMoney(grandTotalAll) + '</div>' +
            '<div class="hero-split">' +
              '<div>' +
                '<div class="hero-sub-label">Fijos anuales</div>' +
                '<div class="hero-sub-val">' + formatMoney(totalFixedAll) + '</div>' +
              '</div>' +
              '<div>' +
                '<div class="hero-sub-label">Mantenimiento y otros</div>' +
                '<div class="hero-sub-val">' + formatMoney(totalVarAll) + '</div>' +
              '</div>' +
            '</div>' +
          '</div>';

        if (reminders.length > 0) {
          html += '<div class="alert-banner ' + (hasUrgent ? "urgent" : "") + '">' +
            '<div class="alert-title">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>' +
              'Recordatorios pr\u00f3ximos' +
            '</div>';
          for (var r = 0; r < reminders.length; r++) {
            var rem = reminders[r];
            var dayLabel = daysLabel(rem.days);
            html += '<div class="alert-item" onclick="openDetail(\'' + rem.vehicleId + '\')">' +
              '<span><b>' + esc(rem.vehicleName) + '</b> &middot; ' + esc(rem.type) + ' (' + formatDateES(rem.date) + ')</span>' +
              '<span class="badge-days ' + (rem.days <= 3 ? "urgent" : "") + '">' + dayLabel + '</span>' +
            '</div>';
          }
          html += '</div>';
        }

        html += '<div class="section-label">Tus veh\u00edculos</div>';

        for (var i = 0; i < state.vehicles.length; i++) {
          var v = state.vehicles[i];
          var vExpenses = state.expenses.filter(function(ex) { return ex.vehiculo_id === v.id; });
          var varTotal = vExpenses.reduce(function(sum, ex) { return sum + parseDecimal(ex.importe); }, 0);
          var fixedTotal = parseDecimal(v.seguro_importe) + parseDecimal(v.impuesto_importe);
          var grandTotal = varTotal + fixedTotal;
          var vAlerts = getVehicleAlerts(v);

          var avatarHtml = v.foto_url
            ? '<img src="' + esc(fileUrl(v.foto_url)) + '" alt="Foto">'
            : '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>';

          var alertsRowHtml = "";
          if (vAlerts.length > 0) {
            alertsRowHtml += '<div class="vehicle-card-alerts">';
            for (var a = 0; a < vAlerts.length; a++) {
              var al = vAlerts[a];
              var dStr = daysLabel(al.days).toLowerCase();
              alertsRowHtml += '<span class="mini-alert-pill ' + (al.days <= 3 ? "urgent" : "") + '">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>' +
                esc(al.type) + ' ' + dStr +
              '</span>';
            }
            alertsRowHtml += '</div>';
          }

          html += '' +
            '<div class="card vehicle-card" onclick="openDetail(\'' + v.id + '\')">' +
              '<div class="vehicle-card-top">' +
                '<div class="vehicle-avatar">' + avatarHtml + '</div>' +
                '<div class="vehicle-info">' +
                  '<div class="vehicle-name">' + esc(v.nombre) + '</div>' +
                  (v.matricula ? '<span class="plate-badge">' + esc(v.matricula) + '</span>' : '<span style="font-size:13px;color:var(--text-sec);">Sin matr\u00edcula</span>') +
                '</div>' +
                '<div class="vehicle-total">' +
                  '<div class="vehicle-total-amount">' + formatMoney(grandTotal) + '</div>' +
                  '<div class="vehicle-total-sub">' + vExpenses.length + (vExpenses.length === 1 ? ' gasto' : ' gastos') + '</div>' +
                '</div>' +
              '</div>' +
              alertsRowHtml +
            '</div>';
        }
      }

      html += '</div>';
      return html;
    }

    function openDetail(vehicleId) {
      state.selectedVehicleId = vehicleId;
      state.categoryFilter = "Todas";
      state.view = "detail";
      render();
    }

    function setCategoryFilter(cat) {
      state.categoryFilter = cat;
      render();
    }

    function renderDetail() {
      var v = state.vehicles.find(function(x) { return x.id === state.selectedVehicleId; });
      if (!v) {
        state.view = "list";
        return renderList();
      }

      var allExp = state.expenses.filter(function(e) { return e.vehiculo_id === v.id; });
      var filteredExp = state.categoryFilter === "Todas"
        ? allExp
        : allExp.filter(function(e) { return e.categoria === state.categoryFilter; });

      var fixedTotal = parseDecimal(v.seguro_importe) + parseDecimal(v.impuesto_importe);
      var varTotal = allExp.reduce(function(sum, e) { return sum + parseDecimal(e.importe); }, 0);
      var totalVehicle = fixedTotal + varTotal;

      var avatarHtml = v.foto_url
        ? '<img src="' + esc(fileUrl(v.foto_url)) + '" alt="Foto">'
        : '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>';

      function renderFixedItem(label, amount, dateStr, leadDays, showAmount, kind) {
        var annual = kind !== "itv";
        var days = annual ? getDaysUntilAnnual(dateStr) : getDaysUntil(dateStr);
        var leadVal = isNaN(leadDays) ? 15 : leadDays;
        var badge = "";
        if (dateStr && days !== null && leadVal >= 0 && days <= leadVal) {
          var dTxt = daysLabel(days);
          badge = ' <span class="badge-days ' + (days <= 3 ? "urgent" : "") + '">' + dTxt + '</span>';
        }
        var calBtn = dateStr
          ? '<button type="button" class="cal-btn" onclick="downloadICSFor(\'' + v.id + '\', \'' + kind + '\')">+ Calendario iPhone</button>'
          : '';
        return '' +
          '<div class="fixed-row">' +
            '<div class="fixed-top">' +
              '<span class="fixed-name">' + esc(label) + badge + '</span>' +
              (showAmount ? '<span class="fixed-amount">' + formatMoney(amount) + '</span>' : '') +
            '</div>' +
            '<div class="fixed-meta">' +
              '<span>' + (annual ? "Fecha anual" : "Vence") + ': <b>' + formatDateES(dateStr) + '</b></span>' +
              calBtn +
            '</div>' +
          '</div>';
      }

      var html = '' +
        '<div class="navbar"><div class="navbar-inner">' +
          '<button class="nav-btn" onclick="goBackToList()">&lsaquo; Garaje</button>' +
          '<div class="nav-title">' + esc(v.nombre) + '</div>' +
          '<button class="nav-btn right" onclick="openVehicleForm(\'' + v.id + '\')">Editar</button>' +
        '</div></div>' +
        '<div class="container">' +
          '<div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:14px;">' +
            '<div style="display:flex; align-items:center; gap:14px; min-width:0;">' +
              '<div class="vehicle-avatar" style="width:68px; height:68px;">' + avatarHtml + '</div>' +
              '<div style="min-width:0;">' +
                '<div style="font-size:20px; font-weight:700; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + esc(v.nombre) + '</div>' +
                (v.matricula ? '<span class="plate-badge">' + esc(v.matricula) + '</span>' : '') +
              '</div>' +
            '</div>' +
            '<div style="text-align:right; flex-shrink:0;">' +
              '<div style="font-size:11px; color:var(--text-sec);">Total veh\u00edculo</div>' +
              '<div style="font-size:18px; font-weight:700; color:var(--blue);">' + formatMoney(totalVehicle) + '</div>' +
            '</div>' +
          '</div>' +

          '<div class="stats-grid">' +
            '<div class="stat-box">' +
              '<div class="stat-label">Fijos anuales</div>' +
              '<div class="stat-value">' + formatMoney(fixedTotal) + '</div>' +
            '</div>' +
            '<div class="stat-box">' +
              '<div class="stat-label">Mantenimiento / Gastos</div>' +
              '<div class="stat-value">' + formatMoney(varTotal) + '</div>' +
            '</div>' +
          '</div>' +

          '<div class="section-label">Datos fijos anuales y avisos</div>' +
          '<div class="card">' +
            renderFixedItem("Seguro anual", v.seguro_importe, v.seguro_fecha, parseInt(v.seguro_aviso, 10), true, "seguro") +
            renderFixedItem("Impuesto circulaci\u00f3n", v.impuesto_importe, v.impuesto_fecha, parseInt(v.impuesto_aviso, 10), true, "impuesto") +
            renderFixedItem("Pr\u00f3xima ITV", 0, v.itv_fecha, parseInt(v.itv_aviso, 10), false, "itv") +
          '</div>' +

          '<div style="display:flex; justify-content:space-between; align-items:center; margin:18px 0 8px;">' +
            '<div class="section-label" style="margin:0 0 0 6px;">Historial de gastos (' + allExp.length + ')</div>' +
            '<button class="cal-btn" style="font-size:13px; padding:6px 12px;" onclick="openExpenseForm(null)">+ A\u00f1adir gasto</button>' +
          '</div>' +

          '<div class="chips">' +
            '<button class="chip ' + (state.categoryFilter === "Todas" ? "active" : "") + '" onclick="setCategoryFilter(\'Todas\')">Todas</button>';

      for (var c = 0; c < CATEGORIES.length; c++) {
        var cat = CATEGORIES[c];
        html += '<button class="chip ' + (state.categoryFilter === cat ? "active" : "") + '" onclick="setCategoryFilter(\'' + cat + '\')">' + cat + '</button>';
      }

      html += '</div><div class="card">';

      if (filteredExp.length === 0) {
        html += '<div style="text-align:center; padding:24px 10px; color:var(--text-sec); font-size:14px;">No hay gastos registrados en esta categor\u00eda.</div>';
      } else {
        for (var k = 0; k < filteredExp.length; k++) {
          var exp = filteredExp[k];
          var meta = formatDateES(exp.fecha) + " &middot; " + esc(exp.categoria);
          if (exp.km) meta += " &middot; " + Number(exp.km).toLocaleString("es-ES") + " km";

          var invBtn = "";
          if (exp.factura_url) {
            invBtn = '<div><button type="button" class="invoice-pill" onclick="openInvoiceViewerById(event, \'' + exp.id + '\')">' +
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
              'Ver factura</button></div>';
          }

          html += '' +
            '<div class="expense-item" onclick="openExpenseForm(\'' + exp.id + '\')">' +
              '<div style="min-width:0; flex:1;">' +
                '<div class="expense-title">' + esc(exp.concepto) + '</div>' +
                '<div class="expense-sub">' + meta + '</div>' +
                (exp.notas ? '<div class="expense-sub" style="margin-top:2px;">' + esc(exp.notas) + '</div>' : '') +
                invBtn +
              '</div>' +
              '<div style="font-size:16px; font-weight:700; white-space:nowrap;">' + formatMoney(exp.importe) + '</div>' +
            '</div>';
        }
      }

      html += '</div></div>';
      return html;
    }

    function goBackToList() {
      state.view = "list";
      render();
    }

    function renderReminderSelect(name, selectedVal) {
      var val = (selectedVal !== null && selectedVal !== undefined && !isNaN(selectedVal)) ? Number(selectedVal) : 15;
      var out = '<select name="' + name + '" class="form-select">';
      for (var i = 0; i < REMINDER_OPTIONS.length; i++) {
        var opt = REMINDER_OPTIONS[i];
        out += '<option value="' + opt.value + '" ' + (opt.value === val ? "selected" : "") + '>' + opt.label + '</option>';
      }
      out += '</select>';
      return out;
    }

    function renderVehicleForm() {
      var d = state.vehicleDraft || {};
      var isEdit = Boolean(state.editingVehicleId);

      var photoContent = state.tempPhotoPreview
        ? '<img src="' + esc(state.tempPhotoPreview) + '" alt="Vista previa">'
        : '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>A\u00f1adir foto</span>';

      return '' +
        '<div class="navbar"><div class="navbar-inner">' +
          '<button class="nav-btn" onclick="' + (isEdit ? "openDetail('" + state.editingVehicleId + "')" : "goBackToList()") + '">Cancelar</button>' +
          '<div class="nav-title">' + (isEdit ? "Editar veh\u00edculo" : "Nuevo veh\u00edculo") + '</div>' +
          '<div style="min-width:72px;"></div>' +
        '</div></div>' +
        '<div class="container">' +
          '<form id="vehicle-form" onsubmit="saveVehicle(event)">' +
            '<div class="card">' +
              '<label class="photo-picker">' +
                photoContent +
                '<input type="file" accept="image/*" style="display:none;" onchange="onVehiclePhotoSelected(this)">' +
              '</label>' +
              '<div class="form-group">' +
                '<label class="form-label">Nombre / Modelo *</label>' +
                '<input name="nombre" type="text" class="form-input" placeholder="Ej: Seat Le\u00f3n FR" value="' + esc(d.nombre || "") + '" required>' +
              '</div>' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label class="form-label">Matr\u00edcula</label>' +
                '<input name="matricula" type="text" class="form-input" placeholder="Ej: 1234 ABC" value="' + esc(d.matricula || "") + '">' +
              '</div>' +
            '</div>' +

            '<div class="section-label">Seguro Anual</div>' +
            '<div class="card">' +
              '<div class="form-group">' +
                '<label class="form-label">Importe anual (&euro;)</label>' +
                '<input name="seguro_importe" type="text" inputmode="decimal" class="form-input" placeholder="0.00" value="' + esc(d.seguro_importe || "") + '">' +
              '</div>' +
              '<div class="form-group">' +
                '<label class="form-label">Fecha de renovaci\u00f3n</label>' +
                '<input name="seguro_fecha" type="date" class="form-input" value="' + esc(d.seguro_fecha || "") + '">' +
              '</div>' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label class="form-label">Recordatorio anticipado</label>' +
                renderReminderSelect("seguro_aviso", d.seguro_aviso) +
              '</div>' +
            '</div>' +

            '<div class="section-label">Impuesto de Circulaci\u00f3n</div>' +
            '<div class="card">' +
              '<div class="form-group">' +
                '<label class="form-label">Importe anual (&euro;)</label>' +
                '<input name="impuesto_importe" type="text" inputmode="decimal" class="form-input" placeholder="0.00" value="' + esc(d.impuesto_importe || "") + '">' +
              '</div>' +
              '<div class="form-group">' +
                '<label class="form-label">Fecha anual de pago</label>' +
                '<input name="impuesto_fecha" type="date" class="form-input" value="' + esc(d.impuesto_fecha || "") + '">' +
              '</div>' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label class="form-label">Recordatorio anticipado</label>' +
                renderReminderSelect("impuesto_aviso", d.impuesto_aviso) +
              '</div>' +
            '</div>' +

            '<div class="section-label">Inspecci\u00f3n T\u00e9cnica (ITV)</div>' +
            '<div class="card">' +
              '<div class="form-group">' +
                '<label class="form-label">Fecha pr\u00f3xima ITV</label>' +
                '<input name="itv_fecha" type="date" class="form-input" value="' + esc(d.itv_fecha || "") + '">' +
              '</div>' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label class="form-label">Recordatorio anticipado</label>' +
                renderReminderSelect("itv_aviso", d.itv_aviso) +
              '</div>' +
            '</div>' +

            '<button type="submit" class="btn-primary" ' + (state.saving ? "disabled" : "") + '>' +
              (state.saving ? "Guardando en la nube..." : "Guardar veh\u00edculo") +
            '</button>' +
            (isEdit ? '<button type="button" class="btn-danger-soft" onclick="deleteVehicle(\'' + state.editingVehicleId + '\')">Eliminar veh\u00edculo</button>' : '') +
          '</form>' +
        '</div>';
    }

    function renderExpenseForm() {
      var exp = state.editingExpenseId
        ? state.expenses.find(function(x) { return x.id === state.editingExpenseId; })
        : null;
      var todayStr = todayLocal();
      var d = state.expenseDraft || {
        concepto: exp ? (exp.concepto || "") : "",
        categoria: exp ? exp.categoria : CATEGORIES[0],
        importe: (exp && exp.importe !== null && exp.importe !== undefined) ? exp.importe : "",
        fecha: exp ? (exp.fecha || todayStr) : todayStr,
        km: (exp && exp.km) ? exp.km : "",
        notas: exp ? (exp.notas || "") : ""
      };

      var catOptions = "";
      for (var i = 0; i < CATEGORIES.length; i++) {
        var c = CATEGORIES[i];
        var sel = (d.categoria || CATEGORIES[0]) === c;
        catOptions += '<option value="' + c + '" ' + (sel ? "selected" : "") + '>' + c + '</option>';
      }

      var hasAttachment = Boolean(state.tempInvoiceName || state.tempInvoiceUrl);
      var attachmentHtml = hasAttachment
        ? '<div style="display:flex; align-items:center; justify-content:space-between; background:var(--input-bg); padding:10px 12px; border-radius:10px;">' +
            '<span style="font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + esc(state.tempInvoiceName || "Documento adjunto") + '</span>' +
            '<button type="button" style="background:none; border:none; color:var(--red); font-weight:600; font-size:13px; cursor:pointer;" onclick="clearInvoiceAttachment()">Quitar</button>' +
          '</div>'
        : '<label class="btn-secondary" style="cursor:pointer;">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>' +
            'Subir foto o PDF de factura' +
            '<input type="file" accept="image/*,application/pdf" style="display:none;" onchange="onInvoiceSelected(this)">' +
          '</label>';

      return '' +
        '<div class="navbar"><div class="navbar-inner">' +
          '<button class="nav-btn" onclick="openDetail(\'' + state.selectedVehicleId + '\')">Cancelar</button>' +
          '<div class="nav-title">' + (exp ? "Editar gasto" : "Nuevo gasto") + '</div>' +
          '<div style="min-width:72px;"></div>' +
        '</div></div>' +
        '<div class="container">' +
          '<form id="expense-form" onsubmit="saveExpense(event)">' +
            '<div class="card">' +
              '<div class="form-group">' +
                '<label class="form-label">Concepto *</label>' +
                '<input name="concepto" type="text" class="form-input" placeholder="Ej: Cambio de aceite y filtros" value="' + esc(d.concepto) + '" required>' +
              '</div>' +
              '<div class="form-group">' +
                '<label class="form-label">Categor\u00eda</label>' +
                '<select name="categoria" class="form-select">' + catOptions + '</select>' +
              '</div>' +
              '<div class="form-group">' +
                '<label class="form-label">Importe (&euro;) *</label>' +
                '<input name="importe" type="text" inputmode="decimal" class="form-input" placeholder="0.00" value="' + esc(d.importe) + '" required>' +
              '</div>' +
              '<div class="form-group">' +
                '<label class="form-label">Fecha</label>' +
                '<input name="fecha" type="date" class="form-input" value="' + esc(d.fecha) + '">' +
              '</div>' +
              '<div class="form-group">' +
                '<label class="form-label">Kilometraje (opcional)</label>' +
                '<input name="km" type="number" class="form-input" placeholder="Ej: 85400" value="' + esc(d.km) + '">' +
              '</div>' +
              '<div class="form-group">' +
                '<label class="form-label">Notas (taller, detalles...)</label>' +
                '<input name="notas" type="text" class="form-input" placeholder="Opcional" value="' + esc(d.notas) + '">' +
              '</div>' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label class="form-label">Adjuntar factura o ticket</label>' +
                attachmentHtml +
              '</div>' +
            '</div>' +
            '<button type="submit" class="btn-primary" ' + (state.saving ? "disabled" : "") + '>' +
              (state.saving ? "Subiendo y guardando..." : "Guardar gasto") +
            '</button>' +
            (exp ? '<button type="button" class="btn-danger-soft" onclick="deleteExpense(\'' + exp.id + '\')">Eliminar gasto</button>' : '') +
          '</form>' +
        '</div>';
    }

    function renderViewerModal() {
      if (!state.viewer) return "";
      var isPdf = (state.viewer.type && state.viewer.type.indexOf("pdf") !== -1) ||
                  (state.viewer.url && state.viewer.url.toLowerCase().indexOf(".pdf") !== -1);

      var content = isPdf
        ? '<iframe src="' + esc(state.viewer.url) + '"></iframe>'
        : '<img src="' + esc(state.viewer.url) + '" style="transform:scale(' + (state.zoomed ? "1.8" : "1") + '); cursor:zoom-in;" onclick="toggleZoom()" alt="Factura">';

      return '' +
        '<div class="modal-overlay">' +
          '<div class="modal-header">' +
            '<span style="font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%;">' + esc(state.viewer.name) + '</span>' +
            '<div style="display:flex; gap:12px;">' +
              (!isPdf ? '<button class="cal-btn" style="background:rgba(255,255,255,0.2); color:#fff;" onclick="toggleZoom()">' + (state.zoomed ? "Alejar" : "Zoom") + '</button>' : '') +
              '<a class="cal-btn" style="background:rgba(255,255,255,0.2); color:#fff; text-decoration:none;" href="' + esc(state.viewer.url) + '" target="_blank" rel="noopener">Abrir</a>' +
              '<button class="cal-btn" style="background:#FF3B30; color:#fff;" onclick="closeInvoiceViewer()">Cerrar</button>' +
            '</div>' +
          '</div>' +
          '<div class="modal-body">' + content + '</div>' +
        '</div>';
    }

    function render() {
      var root = document.getElementById("app");
      if (!SUPABASE_URL || SUPABASE_URL.indexOf("http") !== 0 || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf("PEGA_AQUI") !== -1) {
        root.innerHTML = renderConfigMissing();
        return;
      }
      if (!state.session) {
        root.innerHTML = renderAuth();
        return;
      }

      var screen = "";
      if (state.view === "detail") screen = renderDetail();
      else if (state.view === "vehicleForm") screen = renderVehicleForm();
      else if (state.view === "expenseForm") screen = renderExpenseForm();
      else screen = renderList();

      root.innerHTML = screen + renderViewerModal();
    }

    async function initApp() {
      if (SUPABASE_URL && SUPABASE_URL.indexOf("http") === 0 && SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.indexOf("PEGA_AQUI") === -1) {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        var res = await sb.auth.getSession();
        if (res.data && res.data.session) {
          state.session = res.data.session;
          await loadUserData();
          return;
        }
      }
      state.loading = false;
      render();
    }

    initApp();
  </script>
</body>
</html>
